name: Probe FCF
on:
  push:
    branches: [fcf-probe]
    paths: [tools/probe.js]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i playwright-core@1.48.2 --no-save && mkdir -p probe && node tools/probe.js || true
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add probe
          git commit -m "browser probe" || true
          git push
