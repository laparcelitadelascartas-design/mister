<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2F7F4B">
<title>Familias · Míster</title>
<style>
:root { --pitch: #2F7F4B; --pitch-d: #1D5434; --ink: #1D2A22; --muted: #5B6B60; --line: #DDE3DA; --bg: #F4F6F1; --card: #fff; --ok: #1E8A4C; --no: #C2412D; --gold: #E9AD00; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); }
header { background: linear-gradient(160deg, var(--pitch), var(--pitch-d)); color: #fff; padding: calc(18px + env(safe-area-inset-top)) 18px 22px; }
.club { display: flex; align-items: center; gap: 12px; }
.club img { width: 54px; height: 54px; border-radius: 50%; background: #fff; }
.club b { display: block; font-size: 18px; }
.club span { opacity: .85; font-size: 14px; }
.nino { display: flex; align-items: center; gap: 12px; margin-top: 18px; }
.dorsal { flex: none; width: 46px; height: 46px; border-radius: 50%; background: #fff; color: var(--pitch); font-weight: 800; font-size: 20px; display: grid; place-items: center; }
.nino h1 { margin: 0; font-size: 26px; line-height: 1.15; }
main { max-width: 640px; margin: 0 auto; padding: 14px 14px calc(28px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin: 0 0 14px; }
.card h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--pitch); }
.big { font-size: 19px; font-weight: 700; margin: 0 0 4px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
p { margin: 6px 0; }
a { color: var(--pitch); font-weight: 600; }
.btns { display: flex; gap: 10px; margin-top: 12px; }
button { font: inherit; border-radius: 12px; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 12px 14px; min-height: 48px; cursor: pointer; }
button.si { flex: 1; background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
button.no { flex: 1; background: #fff; border-color: var(--no); color: var(--no); font-weight: 700; }
button.sel { outline: 3px solid rgba(0,0,0,.18); outline-offset: 2px; }
button.link { border: 0; background: none; color: var(--pitch); padding: 6px 0; min-height: 0; font-weight: 600; text-decoration: underline; }
button[disabled] { opacity: .55; }
input[type=text] { font: inherit; width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: #fff; }
.estado { margin-top: 12px; padding: 10px 12px; border-radius: 12px; font-weight: 600; }
.estado.si { background: #E3F4EA; color: var(--ok); }
.estado.no { background: #FBE7E3; color: var(--no); }
.estado.pend { background: #FFF5D6; color: #7A5B00; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.row:first-of-type { border-top: 0; }
.row .t { min-width: 0; }
.row .t b { display: block; }
.row button { flex: none; min-height: 40px; padding: 8px 12px; font-size: 14px; }
.tag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: #EEF2EC; color: var(--muted); }
.tag.si { background: #E3F4EA; color: var(--ok); }
.tag.no { background: #FBE7E3; color: var(--no); }
.st { color: var(--gold); letter-spacing: 2px; }
.st i { color: var(--line); font-style: normal; }
.res { font-weight: 800; font-variant-numeric: tabular-nums; }
.aviso { text-align: center; padding: 40px 20px; }
footer { text-align: center; font-size: 13px; color: var(--muted); padding: 6px 20px 20px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
.toast.on { opacity: 1; }
</style>
</head>

        h += '<div class="row"><div class="t"><b>' + (c ? c + ", " : "") + esc(fecha(f)) + "</b>" + (a ? '<span class="tag no">✗ No viene' + (a.c ? " · " + esc(a.c) : "") + "</span>" : "") + "</div>";
        h += a ? '<button data-deshacer="' + f + '">Deshacer</button>' : abierto["a" + f] ? "" : '<button data-ausente="' + f + '">No viene</button>';
        h += "</div>";
        if (!a && abierto["a" + f]) h += '<input type="text" id="a-' + f + '" maxlength="80" placeholder="Motivo (opcional)"><div class="btns"><button data-cancelar="' + f + '">Cancelar</button><button class="no" data-avisar="' + f + '">Avisar que no viene</button></div>';
      });
      h += "</section>";
    }
    if (prox.length > 1) {
      h += '<section class="card"><h2>Siguientes partidos</h2>';
      prox.slice(1).forEach(function (p) {
        var r = respConv(p.k);
        h += '<div class="row"><div class="t"><b>' + esc(fechaC(p.fecha)) + (p.hora ? " · " + esc(p.hora) : "") + "</b><span class=\"small\">" + (p.casa ? "En casa contra " : "En el campo de ") + esc(p.rival) + "</span></div>" + (r ? '<span class="tag ' + r.r + '">' + (r.r === "si" ? "✓ Va" : "✗ No puede") + "</span>" : p.conv === 0 ? '<span class="tag">No convocado</span>' : "") + "</div>";
        if (abierto["x" + p.k]) h += bloqueConv(p, false);
        else if (p.conv !== 0) h += '<button class="link" data-abrir="' + esc(p.k) + '">' + (r ? "Cambiar respuesta" : "Avisar si no puede venir") + "</button>";
      });
      h += "</section>";
    }
    if ((D.mes || []).length) {
      h += '<section class="card"><h2>Este mes trabajamos</h2>';
      D.mes.forEach(function (m) { h += "<p><b>" + esc(m.n) + "</b>" + (m.d ? '<br><span class="small muted">' + esc(m.d) + "</span>" : "") + "</p>"; });
      h += "</section>";
    }
    (D.inf || []).slice().reverse().forEach(function (i) {
      h += '<section class="card"><h2>Informe del ' + esc(i.tr) + "</h2>";
      i.r.forEach(function (a) { h += '<div class="row"><span>' + esc(a[0]) + "</span>" + estrellas(a[1]) + "</div>"; });
      if (i.obj) h += '<p style="margin-top:10px"><b>Lo que estamos trabajando:</b> ' + esc(i.obj) + "</p>";
      if (i.com) h += "<p><b>Mensaje del entrenador:</b> " + esc(i.com) + "</p>";
      h += "</section>";
    });
    if (D.dip) h += '<section class="card"><h2>Diploma de la temporada</h2><p class="big">🏅 «' + esc(D.dip) + "»</p></section>";
    if ((D.res || []).length) {
      h += '<section class="card"><h2>Últimos resultados</h2>';
      D.res.forEach(function (r) { h += '<div class="row"><div class="t"><b>' + esc(fechaC(r.fecha)) + '</b><span class="small">' + (r.casa ? "Contra " : "En el campo de ") + esc(r.rival) + '</span></div><span class="res">' + r.gf + " – " + r.gc + "</span></div>"; });
      h += "</section>";
    }
    if (!h) h = '<div class="card aviso"><p class="muted">Todavía no hay partidos ni entrenamientos programados.</p></div>';
    $("#main").innerHTML = h;
  }
  function enviar(path, val, msg) {
    if (ocupado) return; ocupado = true;
    api(val === null ? "DELETE" : "PUT", "/fam/" + tok + path, val).then(function () { toast(msg); return api("GET", "/fam/" + tok + "/r"); }).then(function (r) { R = r || {}; ocupado = false; pintar(); })
      .catch(function () { ocupado = false; toast("No se ha podido enviar. Revisa la conexión."); });
  }
  document.addEventListener("click", function (ev) {
    var b = ev.target.closest("button"); if (!b) return;
    var d = b.dataset;
    if (d.resp) {
      var inp = document.getElementById("c-" + d.k), c = inp ? inp.value.trim() : "";
      abierto[d.k] = false; abierto["x" + d.k] = false;
      R.c = R.c || {}; R.c[d.k] = { r: d.resp, c: c };
      pintar();
      enviar("/r/c/" + encodeURIComponent(d.k), { r: d.resp, c: c, t: { ".sv": "timestamp" } }, d.resp === "si" ? "¡Gracias! Confirmado" : "Gracias por avisar");
    } else if (d.cambiar) { abierto[d.cambiar] = true; abierto["x" + d.cambiar] = true; pintar(); }
    else if (d.abrir) { abierto["x" + d.abrir] = true; abierto[d.abrir] = true; pintar(); }
    else if (d.ausente) { abierto["a" + d.ausente] = true; pintar(); var i = document.getElementById("a-" + d.ausente); if (i) i.focus(); }
    else if (d.cancelar) { abierto["a" + d.cancelar] = false; pintar(); }
    else if (d.avisar) {
      var ia = document.getElementById("a-" + d.avisar), m = ia ? ia.value.trim() : "";
      abierto["a" + d.avisar] = false; R.a = R.a || {}; R.a[d.avisar] = { r: "no", c: m }; pintar();
      enviar("/r/a/" + d.avisar, { r: "no", c: m, t: { ".sv": "timestamp" } }, "Gracias por avisar");
    } else if (d.deshacer) { if (R.a) delete R.a[d.deshacer]; pintar(); enviar("/r/a/" + d.deshacer, null, "Aviso quitado"); }
  });
  cargar();
  setInterval(function () { if (document.visibilityState !== "hidden" && !ocupado && !document.activeElement.matches("input")) cargar(); }, 60000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") cargar(); });
  window.addEventListener("hashchange", function () { var t = (location.hash || "").slice(1).replace(/[^a-z0-9]/g, ""); if (t && t !== tok) { tok = t; try { localStorage.setItem("mister_fam_tok", tok); } catch (e) { /* nada */ } D = null; cargar(); } });
})();
</script>
