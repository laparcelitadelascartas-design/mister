<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7f4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Míster">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Míster Entrenamientos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Míster · pizarra de entrenador: verde césped, blanco tiza y naranja de cono.
   Layout: app móvil de una columna, barra inferior fija, tarjetas por bloques. */
:root {
  --bg: #edf1ec;
  --surface: #ffffff;
  --surface-2: #f4f7f3;
  --ink: #13221a;
  --muted: #5b6c62;
  --line: #d6dfd8;
  --pitch: #2f7f4b;
  --pitch-ink: #ffffff;
  --accent: #f0561b;
  --accent-ink: #ffffff;
  --accent-soft: #ffe6da;
  --i1: #2f9e6a; --i2: #79b33d; --i3: #d9a400; --i4: #ec7d1a; --i5: #dc3d43;
  --warn-bg: #fff4d6; --warn-ink: #6b4e00;
  --display: "Barlow Condensed", "Roboto Condensed", "Arial Narrow", sans-serif-condensed, sans-serif;
  --body: "Barlow", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --shadow: 0 1px 2px rgba(19, 34, 26, .06), 0 4px 14px rgba(19, 34, 26, .06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c1511; --surface: #14211b; --surface-2: #1a2a22; --ink: #e6efe8; --muted: #93a59a; --line: #26382e;
    --pitch: #2a7445; --accent: #ff6a33; --accent-soft: #3b2117; --warn-bg: #3a3012; --warn-ink: #f3d98a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c1511; --surface: #14211b; --surface-2: #1a2a22; --ink: #e6efe8; --muted: #93a59a; --line: #26382e;
  --pitch: #2a7445; --accent: #ff6a33; --accent-soft: #3b2117; --warn-bg: #3a3012; --warn-ink: #f3d98a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: 30px; text-transform: uppercase; }
h2 { font-size: 22px; text-transform: uppercase; }
h3 { font-size: 20px; }
p { margin: 0; }
small, .muted { color: var(--muted); }
.num, .tab { font-variant-numeric: tabular-nums; }

#app { max-width: 760px; margin: 0 auto; min-height: 100%; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
#main { padding: calc(10px + env(safe-area-inset-top)) 16px 24px; display: flex; flex-direction: column; gap: 16px; }

/* Cabecera */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 6px; }
.top .eyebrow { font-family: var(--display); font-size: 14px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo { width: 52px; height: 52px; flex: none; object-fit: contain; }
.brand-mark { width: 40px; height: 40px; border-radius: 10px; background: var(--pitch); display: grid; place-items: center; flex: none; }
.pagebar { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 5; background: var(--bg); margin: -10px -16px 0; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line); }
.pagebar h2 { flex: 1; font-size: 20px; }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.iconbtn svg { width: 20px; height: 20px; }

/* Tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.card.hero { background: var(--pitch); color: var(--pitch-ink); border: 0; position: relative; overflow: hidden; }
.card.hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border: 2px solid rgba(255, 255, 255, .18); border-radius: 50%; }
.card.hero .muted, .card.hero small { color: rgba(255, 255, 255, .78); }
.card-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.card-h h2 { font-size: 18px; }
.link { background: none; border: 0; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 15px; }
.section-t { font-family: var(--display); font-size: 15px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 8px 2px -4px; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 15px; }
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.btn.ghost { background: transparent; }
.btn.big { min-height: 54px; font-size: 18px; font-family: var(--display); letter-spacing: .04em; text-transform: uppercase; width: 100%; }
.btn.danger { color: var(--i5); }
.btn.sm { min-height: 36px; padding: 6px 12px; font-size: 14px; }
.hero .btn { border-color: rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff; }
.hero .btn.primary { background: #fff; color: var(--pitch); border-color: #fff; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .btn { flex: 1 1 auto; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Chips y selectores */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px; font-size: 15px; font-weight: 500; min-height: 40px; display: inline-flex; flex-direction: column; align-items: flex-start; justify-content: center; line-height: 1.15; text-align: left; }
.chip small { font-size: 12px; font-weight: 400; }
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip.on small { color: inherit; opacity: .75; }
.chips.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.chips.cards .chip { border-radius: 12px; padding: 10px 12px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 9px 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.hero .tag { background: rgba(255, 255, 255, .14); border-color: transparent; color: #fff; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }

/* Formulario */
.form { display: flex; flex-direction: column; gap: 20px; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field > label, .field > .lbl { font-family: var(--display); font-size: 16px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.field > .lbl small { font-family: var(--body); text-transform: none; letter-spacing: 0; font-weight: 400; }
.note { font-size: 14px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; border-left: 3px solid var(--pitch); }
.note.warn { background: var(--warn-bg); color: var(--warn-ink); border-left-color: var(--i3); }
input[type="text"], input[type="date"], input[type="number"], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 16px;
}
textarea { min-height: 96px; resize: vertical; }
.stepper { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 14px; }
.stepper .v { font-family: var(--display); font-size: 26px; font-weight: 700; min-width: 34px; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .ctr { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 22px; line-height: 1; }
.sticky-cta { position: sticky; bottom: calc(76px + env(safe-area-inset-bottom)); padding: 8px 0 0; background: linear-gradient(transparent, var(--bg) 30%); z-index: 4; }

/* Estadísticas */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.hero .stat { background: rgba(255, 255, 255, .12); }
.stat b { display: block; font-family: var(--display); font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--muted); }
.hero .stat span { color: rgba(255, 255, 255, .78); }
@media (max-width: 400px) { .stats { grid-template-columns: repeat(2, 1fr); } }

/* Semana */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 104px; }
.day .dn { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; }
.day .dd { font-family: var(--display); font-size: 20px; font-weight: 700; line-height: 1; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day .bar { width: 10px; flex: 1; min-height: 28px; background: var(--surface-2); border-radius: 4px; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.day .bar i { display: block; background: var(--pitch); border-radius: 4px; }
.day .bar i.real { background: var(--accent); }
.day .md { font-size: 10.5px; font-weight: 700; color: var(--muted); min-height: 14px; }

/* Línea de tiempo */
.timeline { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; }
.timeline i { display: block; height: 100%; }
.tl-cal { background: var(--i2); } .tl-pri { background: var(--accent); } .tl-vc { background: var(--i1); }
.tl-legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.tl-legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 5px; background: currentColor; vertical-align: 0; }

/* Bloques y tareas */
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; border-bottom: 2px solid var(--ink); padding-bottom: 6px; }
.block-h h2 { font-size: 20px; }
.block-h .num { font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--muted); }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.task-h { display: flex; gap: 12px; align-items: flex-start; padding: 14px 14px 10px; }
.bib { flex: none; width: 36px; height: 40px; border-radius: 8px 8px 12px 12px; background: var(--accent); color: #fff; font-family: var(--display); font-weight: 700; font-size: 22px; display: grid; place-items: center; }
.task-h .tt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-h .meta { font-size: 14px; color: var(--muted); }
.int { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; color: #fff; white-space: nowrap; }
.int.i1 { background: var(--i1); } .int.i2 { background: var(--i2); } .int.i3 { background: var(--i3); } .int.i4 { background: var(--i4); } .int.i5 { background: var(--i5); }
.pitch { display: block; width: 100%; height: auto; }
.task .pitch-wrap { padding: 0 14px; }
.task .pitch-wrap .pitch { border-radius: 10px; max-height: 300px; }
.task-b { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 12px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 0; }
.facts div { min-width: 0; }
.facts dt { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font-size: 14.5px; }
@media (max-width: 420px) { .facts { grid-template-columns: 1fr; } }
.callout { border-radius: 10px; padding: 10px 12px; font-size: 14.5px; background: var(--accent-soft); }
.callout b { font-family: var(--display); letter-spacing: .04em; text-transform: uppercase; font-size: 14px; color: var(--accent); display: block; }
.callout.green { background: var(--surface-2); border-left: 3px solid var(--pitch); }
.callout.green b { color: var(--pitch); }
ul.pts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; font-size: 15px; }
details { border-top: 1px solid var(--line); padding-top: 10px; }
details summary { font-weight: 600; color: var(--accent); cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
details summary::-webkit-details-marker { display: none; }
details summary::before { content: "+"; font-size: 18px; width: 18px; }
details[open] summary::before { content: "−"; }
details .inner { display: flex; flex-direction: column; gap: 12px; padding-top: 10px; }
.sub-t { font-size: 13px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.var2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.var2 > div { background: var(--surface-2); border-radius: 10px; padding: 10px; font-size: 14px; }
.task-a { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-top: 1px solid var(--line); background: var(--surface-2); }
.task-a .mins { display: flex; align-items: center; gap: 4px; margin-right: auto; }
.task-a .mins b { min-width: 44px; text-align: center; font-family: var(--display); font-size: 20px; font-variant-numeric: tabular-nums; }
.task-a button { min-height: 38px; min-width: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 600; padding: 4px 10px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--muted); }
.legend .lg { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 1px solid rgba(0, 0, 0, .2); }

/* Listas */
.list { display: flex; flex-direction: column; gap: 10px; }
.item { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px; text-align: left; width: 100%; }
.item .thumb { width: 104px; flex: none; }
.item .thumb .pitch { border-radius: 8px; }
.item .it { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.item .it h3 { font-size: 18px; }
.datebox { flex: none; width: 54px; height: 58px; border-radius: 10px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; }
.datebox b { font-family: var(--display); font-size: 24px; line-height: 1; }
.datebox span { font-size: 12px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.item.done .datebox { background: var(--pitch); color: #fff; }
.item.done .datebox span { color: rgba(255, 255, 255, .8); }
.empty { text-align: center; padding: 22px 16px; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 12px; align-items: center; }

/* Plantilla */
.player { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.player:last-child { border-bottom: 0; }
.dorsal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-family: var(--display); font-weight: 700; font-size: 17px; flex: none; }
.player.off { opacity: .5; }
.player .pn { flex: 1; min-width: 0; font-weight: 600; }
.player .pos { font-size: 12px; font-weight: 700; color: var(--muted); width: 34px; }
.toggle { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; font-size: 12.5px; font-weight: 700; padding: 6px 10px; min-height: 34px; }
.toggle.on { background: var(--i1); border-color: var(--i1); color: #fff; }
.addp { display: grid; grid-template-columns: 64px 1fr 90px auto; gap: 6px; }
@media (max-width: 420px) { .addp { grid-template-columns: 56px 1fr 80px; } .addp .btn { grid-column: 1 / -1; } }
.attend { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
.attend button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; font-size: 14px; }
.attend button .dorsal { width: 26px; height: 26px; font-size: 14px; }
.attend button.on { border-color: var(--i1); background: color-mix(in srgb, var(--i1) 14%, var(--surface)); }
.attend button:not(.on) { opacity: .55; text-decoration: line-through; }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.rpe button { min-height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-variant-numeric: tabular-nums; }
.rpe button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Barra inferior */
#nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
#nav .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(7, 1fr); }
#nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 9px 0 10px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 600; letter-spacing: -.01em; min-width: 0; }
#nav a svg { width: 24px; height: 24px; }
#nav a.on { color: var(--accent); }
#nav a.cta span.ic { background: var(--accent); color: #fff; border-radius: 12px; width: 42px; height: 30px; display: grid; place-items: center; margin-top: -2px; }
#nav a.cta { color: var(--ink); }

/* Hoja inferior (modal) */
#sheet .bg { position: fixed; inset: 0; background: rgba(5, 12, 8, .5); z-index: 70; }
#sheet .sh { position: fixed; left: 0; right: 0; bottom: 0; z-index: 71; max-height: 92%; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; max-width: 760px; margin: 0 auto; box-shadow: 0 -10px 30px rgba(0, 0, 0, .25); }
#sheet .sh-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
#sheet .sh-h h2 { flex: 1; font-size: 20px; }
#sheet .sh-b { overflow-y: auto; padding: 14px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }

/* Modo entrenamiento */
#live .lv { position: fixed; inset: 0; z-index: 60; background: #0d1a13; color: #fff; display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap: 12px; overflow-y: auto; }
.lv-top { display: flex; align-items: center; gap: 10px; }
.lv-top .iconbtn { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .15); color: #fff; }
.lv-top span { flex: 1; font-size: 14px; color: rgba(255, 255, 255, .7); font-weight: 600; }
.lv h2 { font-size: 28px; color: #fff; }
.lv-ph { align-self: flex-start; font-family: var(--display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 16px; padding: 5px 12px; border-radius: 8px; background: var(--i1); }
.lv-ph.rest { background: #3b6fd8; }
.lv-ph.wait { background: rgba(255, 255, 255, .15); }
.lv-time { font-family: var(--display); font-weight: 700; font-size: clamp(88px, 28vw, 168px); line-height: .9; text-align: center; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.lv-bar { height: 8px; background: rgba(255, 255, 255, .12); border-radius: 4px; overflow: hidden; }

.lv-ctrl { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; }
.lv-ctrl button { min-height: 64px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .08); color: #fff; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.lv-ctrl button.play { background: var(--accent); border-color: var(--accent); font-size: 18px; font-family: var(--display); letter-spacing: .06em; text-transform: uppercase; }
.lv-ctrl svg { width: 26px; height: 26px; }
.lv .pitch { border-radius: 12px; max-height: 34vh; }
.lv-next { font-size: 14px; color: rgba(255, 255, 255, .7); border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 10px; }
.lv ul.pts { color: rgba(255, 255, 255, .88); }
.lv-ph.trans { background: #c98a12; }
.lv-sub { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: rgba(255, 255, 255, .6); font-weight: 700; }
.lv-rest { margin: -4px 0 0; text-align: center; font-size: 14px; color: rgba(255, 255, 255, .7); font-variant-numeric: tabular-nums; }
.lv-top .iconbtn { font-size: 18px; }
.lv-opt { border-top: 1px solid rgba(255, 255, 255, .12); padding-top: 10px; display: grid; gap: 8px; }
.lv-opt > span { font-size: 13px; color: rgba(255, 255, 255, .7); font-weight: 600; }
.lv-opt p { margin: 0; font-size: 13px; color: rgba(255, 255, 255, .6); }
.lv-opt .chip { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .18); color: #fff; }
.lv-opt .chip.on { background: var(--accent); border-color: var(--accent); }

#toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 80; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.guide p + p { margin-top: 8px; }
.kv { display: flex; flex-direction: column; gap: 4px; }
.kv b { font-size: 13px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@media print {
  #nav, .task-a, .pagebar .iconbtn, .row, #toast { display: none !important; }
  body { background: #fff; }
  .task { break-inside: avoid; }
}

/* Partidos */
.res { display: inline-flex; align-items: center; font-family: var(--display); font-weight: 700; font-size: 15px; padding: 2px 9px; border-radius: 6px; color: #fff; font-variant-numeric: tabular-nums; }
.res.rG { background: var(--i1); } .res.rE { background: var(--i3); } .res.rP { background: var(--i5); }
.score-grid { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.score-side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.score-team { font-weight: 600; font-size: 14px; text-align: center; overflow-wrap: anywhere; }
.score-ctr { display: flex; align-items: center; gap: 6px; }
.score-ctr button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 20px; }
.score-n { font-family: var(--display); font-size: 52px; line-height: 1; min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.score-sep { font-family: var(--display); font-size: 36px; color: var(--muted); }
details.card { border-top: 1px solid var(--line); padding-top: 16px; }
details.card summary { font-family: var(--display); font-size: 18px; text-transform: uppercase; letter-spacing: .01em; color: var(--ink); }
.pagebar .res { font-size: 17px; padding: 4px 10px; }

/* Partido en directo */
.card.hero.live { gap: 14px; }
.ls-teams { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; text-align: center; font-weight: 600; font-size: 15px; }
.ls-teams span { overflow-wrap: anywhere; }
.ls-score { font-family: var(--display); font-size: 54px; line-height: 1; white-space: nowrap; }
.ls-clock { display: flex; align-items: baseline; justify-content: center; gap: 8px; font-family: var(--display); }
.ls-clock span { font-size: 64px; line-height: 1; font-weight: 700; }
.ls-clock small { font-family: var(--body); font-size: 14px; color: rgba(255, 255, 255, .8); }
.ls-clock.over span { color: #ffd23f; }
.hero .chip { background: rgba(255, 255, 255, .12); border-color: rgba(255, 255, 255, .25); color: #fff; }
.hero .chip.on { background: #fff; color: var(--pitch); border-color: #fff; }
.btn[disabled] { opacity: .45; }
.evgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px; }
.evb { position: relative; min-height: 60px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-weight: 600; font-size: 14px; line-height: 1.15; padding: 6px; display: flex; align-items: center; justify-content: center; text-align: center; }
.evb:active { transform: scale(.97); }
.evb.gol { background: var(--i1); border-color: var(--i1); color: #fff; }
.evb.riv { background: color-mix(in srgb, var(--i5) 12%, var(--surface)); border-color: color-mix(in srgb, var(--i5) 35%, var(--line)); }
.evb i { position: absolute; top: 4px; right: 6px; font-style: normal; font-size: 12px; font-weight: 700; background: var(--ink); color: var(--bg); border-radius: 999px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 4px; }
.evlist { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; }
.evlist li { display: grid; grid-template-columns: 82px 1fr auto; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); font-size: 14.5px; }
.evlist .riv { color: var(--i5); }
.iconbtn.sm { width: 32px; height: 32px; }
.iconbtn.sm svg { width: 16px; height: 16px; }
.tbl { overflow-x: auto; margin: 0 -4px; }
.stbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.stbl th, .stbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
.stbl th[scope="row"] { text-align: left; font-weight: 600; }
.stbl th[scope="row"] small { font-weight: 400; color: var(--muted); font-size: 11px; }
.stbl thead th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.dorsal.sm { width: 24px; height: 24px; font-size: 13px; display: inline-grid; vertical-align: middle; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.attend.big { grid-template-columns: repeat(2, 1fr); }
.attend.big button { min-height: 52px; font-size: 16px; }
.attend button small { margin-left: auto; }
.attend.campo button:not(.on) { text-decoration: none; opacity: .8; background: var(--surface-2); }

/* Calendario FCF */
.nextfx { background: var(--surface-2); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border-left: 4px solid var(--accent); }
.nextfx .eyebrow { font-family: var(--display); font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.nextfx h3 { font-size: 21px; }
a.btn { text-decoration: none; color: inherit; }
.fxlist { gap: 0 !important; }
.fx { display: grid; grid-template-columns: 34px 1fr auto; grid-template-areas: "j d res" "j r res"; gap: 0 10px; align-items: center; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; width: 100%; }
.fx-j { grid-area: j; font-family: var(--display); font-weight: 700; color: var(--muted); }
.fx-d { grid-area: d; font-size: 13px; color: var(--muted); }
.fx-r { grid-area: r; font-weight: 600; }
.fx .res, .fx .tag { grid-area: res; }
.item.opt { justify-content: space-between; }
.item.opt svg { width: 18px; height: 18px; flex: none; color: var(--muted); }
.item.opt.hl { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stbl tr.me th, .stbl tr.me td { background: var(--accent-soft); }
.loading { padding: 20px 0; text-align: center; }

/* Vídeo */
.vwrap { margin: 0 -16px; background: #000; position: sticky; top: 0; z-index: 6; }
.vwrap video { display: block; width: 100%; max-height: 42vh; background: #000; }
.vctrl { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.vctrl button { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; display: grid; place-items: center; }
.vctrl button.play { background: var(--accent); border-color: var(--accent); color: #fff; }
.vctrl button svg { width: 20px; height: 20px; }
.vbar { display: flex; align-items: center; gap: 8px; background: var(--ink); color: var(--bg); border-radius: 12px; padding: 8px 10px; font-size: 14px; }
.vbar span { flex: 1; }
.vbar .btn { background: transparent; color: var(--bg); border-color: rgba(255,255,255,.3); }
label.btn { cursor: pointer; }
.evlist .link { font-size: 14.5px; padding: 0; text-align: left; }

/* Análisis automático del vídeo */
#vax .lv.vax { z-index: 70; }
#vax .lv { position: fixed; inset: 0; z-index: 70; background: #0d1a13; color: #fff; display: flex; flex-direction: column; padding: calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom)); gap: 12px; overflow-y: auto; }

#vax .btn:not(.primary) { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); color: #fff; }
#vax .btn[disabled] { opacity: .45; }
#vax .chip { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); color: #fff; flex-direction: row; align-items: center; gap: 8px; }
#vax .chip.on { background: var(--accent); border-color: var(--accent); }
.vacv { border-radius: 12px; overflow: hidden; background: #3a3f3c; touch-action: none; flex-shrink: 0; }
#vax .lv > * { flex-shrink: 0; }
.vacv canvas { display: block; width: 100%; margin: 0 auto; touch-action: none; }
.sw { display: inline-block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; }
.check { display: flex; gap: 10px; align-items: center; font-size: 15px; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); }
.vaprev { position: relative; border-radius: 12px; overflow: hidden; background: #000; }
.vaprev video, .vaprev canvas { display: block; width: 100%; }
.vaprev canvas { position: absolute; inset: 0; height: 100%; }
svg.heat { display: block; width: 100%; height: auto; border-radius: 10px; color: var(--muted); margin: 8px 0; }
.evlist.va li { grid-template-columns: 64px 1fr; }
.evlist.va .vabtn { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.evlist.va .vabtn .iconbtn { margin-left: auto; }
.stat b small { font-size: .55em; font-weight: 600; }
#vax .opt-big { display: grid; gap: 4px; text-align: left; padding: 14px 16px; border-radius: 14px; border: 1.5px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .06); color: #fff; }

#piz .pz { position: fixed; inset: 0; z-index: 60; background: #0d1a13; color: #fff; display: flex; flex-direction: column; gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 14px calc(22px + env(safe-area-inset-bottom)); overflow-y: auto; }

.pz-top { display: flex; align-items: center; gap: 8px; }

.pz-top b { flex: 1; font-size: 18px; }

#piz .iconbtn[disabled] { opacity: .35; }
.pz-board { display: flex; justify-content: center; }
.pz-board canvas { display: block; border-radius: 10px; touch-action: none; box-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
.pz-play, .pz-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pz-row > .btn { flex: 1; }

#piz .btn:not(.primary):not(.rec) { background: rgba(255, 255, 255, .08); border-color: rgba(255, 255, 255, .2); color: #fff; }

#piz .seg { display: grid; grid-template-columns: repeat(3, 1fr); background: rgba(255, 255, 255, .08); border-radius: 12px; padding: 4px; gap: 4px; }
#piz .seg button { border: 0; background: transparent; color: rgba(255, 255, 255, .8); font: inherit; font-weight: 700; padding: 10px 4px; border-radius: 9px; }
#piz .seg button.on { background: #fff; color: #0d1a13; }
.pz-bar { display: grid; gap: 8px; }
.pz-hint { margin: 0; font-size: 13.5px; color: rgba(255, 255, 255, .7); }
.pz-forms { flex-wrap: nowrap; overflow-x: auto; }
#piz .pz.ver { justify-content: center; }
.pz-hidden { position: fixed; left: -9999px; top: 0; width: 10px; height: 10px; opacity: 0; pointer-events: none; }

.pz-wait > div { width: min(320px, 80vw); display: grid; gap: 10px; text-align: center; }
.pzi { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: start; }
.pzthumb { border: 0; padding: 0; background: none; border-radius: 8px; overflow: hidden; }
.pzthumb img { display: block; width: 72px; height: auto; }
.pzi .row { display: flex; gap: 6px; margin-top: 6px; align-items: center; }
.pz-forms .chip { white-space: nowrap; flex-shrink: 0; }
#piz .pz-row .btn { white-space: nowrap; flex: 1 1 auto; padding-left: 10px; padding-right: 10px; }

.pz-t { white-space: nowrap; }
.pz-eq { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pz-eq button { border: 1.5px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .06); color: #fff; font: inherit; font-weight: 700; padding: 9px 6px; border-radius: 10px; }
.pz-eq button.on.nos { background: #f0561b; border-color: #f0561b; }
.pz-eq button.on.riv { background: #2f62d0; border-color: #2f62d0; }

.pz-nums { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 12px; }
.pz-nums .chip { justify-content: center; font-weight: 800; font-size: 16px; padding: 10px 0; }
.attend button.usado { opacity: .75; }
.convpre { white-space: pre-wrap; font: 14px/1.45 system-ui, sans-serif; background: var(--soft, #f3f5f2); border-radius: 10px; padding: 10px 12px; margin: 8px 0 0; }
.attend button.off { opacity: .6; }
.diver { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.diver button { border: 1.5px solid var(--line, #dfe5dd); background: var(--card, #fff); border-radius: 14px; padding: 8px 0 6px; display: grid; justify-items: center; gap: 2px; font: inherit; }
.diver button span { font-size: 30px; line-height: 1; }
.diver button i { font-style: normal; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.diver button:active { transform: scale(.96); }

</style>

  var RPE = [0, 2, 3, 5, 7, 8.5];
  var ORDER = { cal: 0, por: 1, pri: 2, vc: 3, comp: 4 };

  function rng(seed) {
    var a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;

  }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function uid() { return "s" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36); }

  function fmt(min) {
    if (min < 1) return Math.round(min * 60) + "''";
    var m = Math.floor(min), s = Math.round((min - m) * 60);
    if (s === 60) { m += 1; s = 0; }
    return s ? m + "' " + s + "''" : m + "'";
  }

  function edadOK(e, cat) { return cat >= e.e[0] && cat <= e.e[1]; }

  function exOK(e, o) {
    if (!edadOK(e, o.cat)) return false;
    for (var i = 0; i < e.mat.length; i++) {
      var m = e.mat[i];
      if (o.mat.indexOf(m) < 0 && !SUB[m]) return false;
    }
    if (e.b.indexOf("por") < 0 && (e.pm || 1) > o.N) return false;
    return true;
  }

  /* Contenidos con al menos 2 tareas para esa edad */
  function contentsFor(cat, tipo) {
    var cs = (TIPOS[tipo] && TIPOS[tipo].cs) || [];
    return cs.filter(function (c) {
      var n = 0;
      EX.forEach(function (e) { if (e.b.indexOf("por") < 0 && edadOK(e, cat) && e.c.indexOf(c) >= 0) n++; });
      return n >= 2;
    });
  }

  function contFinal(o) {
    if (o.tipo === "rec") return ["recuperacion"];
    if (o.tipo === "pre") return ["abp", "velocidad", "posesion"].filter(function (c) { return EX.some(function (e) { return e.b.indexOf("por") < 0 && edadOK(e, o.cat) && e.c.indexOf(c) >= 0; }); });
    var valid = contentsFor(o.cat, o.tipo);
    var c = (o.cont || []).filter(function (x) { return valid.indexOf(x) >= 0; });
    if (!c.length && valid.length) c = [valid[0]];
    return c;
  }

  /* Puntuación base de una tarea para una sesión */
  function makeBase(o, cont, tipo) {
    return function (e) {
      var v = 0;
      var m = e.c.filter(function (c) { return cont.indexOf(c) >= 0; }).length;
      v += Math.min(m, 2) * 10;
      if (!m) {
        var fams = cont.map(function (c) { return CONT[c].f; });
        if (e.c.some(function (c) { return CONT[c] && fams.indexOf(CONT[c].f) >= 0; })) v += 1;
      }
      v += e.m.indexOf(o.met) >= 0 ? 3 : -3;
      if (o.nivel === "alto") v += (e.x - 2) * 0.6;
      else if (o.nivel === "rec") v -= (e.x - 2) * 0.6;
      v -= Math.abs((e.e[0] + e.e[1]) / 2 - o.cat) * 0.25;
      if (e.gk && !o.gk) v -= 1.5;
      switch (o.md) {
        case "md4": if (e.c.indexOf("fuerza") >= 0 || (e.jg && e.sp && e.sp <= 70)) v += 2.5; if (e.jg && e.sp >= 140) v -= 2; break;
        case "md3": if (e.jg && e.sp >= 100) v += 2.5; if (e.sp && e.sp <= 40) v -= 1; break;
        case "md2": if (e.c.indexOf("velocidad") >= 0) v += 3; if (e.i >= 5 && e.jg && e.sp <= 70) v -= 2; break;
        case "md1": if (e.c.indexOf("abp") >= 0 || e.c.indexOf("velocidad") >= 0) v += 2; if (e.i >= 5) v -= 4; break;
      }
      if (e.c.indexOf("recuperacion") >= 0 && tipo !== "rec") v -= 10;
      return v;
    };
  }

  function generar(o) {
    var R = rng(o.seed || (Date.now() & 0x7fffffff));
    var tipo = o.tipo;
    if (o.md === "md1p" && o.cat >= 3) tipo = "rec";
    var oo = Object.assign({}, o, { tipo: tipo });
    var cont = contFinal(oo);
    var s = {
      id: uid(), fecha: o.fecha, cat: o.cat, nivel: o.nivel, met: o.met, tipo: tipo, cont: cont,
      md: o.md, dur: o.dur, N: o.N, gk: o.gk, esp: o.esp, mat: o.mat.slice(), tareas: [], creada: Date.now()
    };
    var pool = EX.filter(function (e) { return exOK(e, o); });
    var used = {};
    var base = makeBase(o, cont, tipo);
    var target = MD[o.md] && MD[o.md].int != null ? MD[o.md].int : TIPOS[tipo].int;
    var kids = o.cat <= 1;

    function pick(block, sc) {
      var best = null, bs = -1e9;
      pool.forEach(function (e) {
        if (e.b.indexOf(block) < 0 || used[e.id]) return;
        var v = sc(e) + R() * 2.5;
        if (v > bs) { bs = v; best = e; }
      });
      if (best) used[best.id] = 1;
      return best;
    }

    /* Reparto de minutos */
    var cal, vc;
    if (tipo === "rec") { cal = Math.round(o.dur * 0.3); vc = Math.max(8, Math.round(o.dur * 0.15)); }
    else { cal = clamp(Math.round(o.dur * (kids ? 0.17 : 0.2)), kids ? 8 : 10, 20); vc = kids ? 5 : (o.dur <= 60 ? 6 : 8); }
    var pri = o.dur - cal - vc;

    /* Calentamiento */
    var calSc = function (e) {
      return base(e) * 0.6 - Math.abs(e.i - (tipo === "pre" ? 3 : 2.5)) * 1.5 + (e.id === "regen" ? (tipo === "rec" ? 20 : -50) : 0);
    };
    var hasFifa = pool.some(function (e) { return e.id === "fifa11"; });
    if (tipo !== "rec" && o.cat >= 3 && cal >= 14 && o.md !== "md1" && hasFifa) {
      used.fifa11 = 1;
      s.tareas.push({ ex: "fifa11", b: "cal", min: 8 });
      var c2 = pick("cal", calSc);
      if (c2) s.tareas.push({ ex: c2.id, b: "cal", min: cal - 8 });
    } else {
      var c1 = pick("cal", calSc);
      if (c1) s.tareas.push({ ex: c1.id, b: "cal", min: cal });
    }
    used.fifa11 = 1;

    /* Parte principal */
    var n;
    if (tipo === "rec") n = 2;
    else if (o.met === "tgfu") n = 3;
    else {
      n = pri <= 30 ? 2 : pri <= 55 ? 3 : 4;
      n = Math.min(5, Math.max(n, Math.ceil(pri / CATS[o.cat].maxTask)));
    }
    var w = [];
    for (var k = 0; k < n; k++) w.push(tipo === "rec" ? 1 : 1 + 0.18 * k);
    var sw = w.reduce(function (a, b) { return a + b; }, 0);
    var mins = w.map(function (x) { return Math.max(5, Math.round(pri * x / sw)); });
    mins[n - 1] += pri - mins.reduce(function (a, b) { return a + b; }, 0);

    var mainSc = function (k) {
      return function (e) {
        var v = base(e) - Math.abs(e.i - target) * 1.2;
        var dx = n === 1 ? 2 : 1 + 2 * k / (n - 1);
        v -= Math.abs(e.x - dx);
        if (k === n - 1) v += e.jg ? 4 : (o.met === "ana" ? 0 : -4);
        else if (e.id === "partido_cond" || e.id === "gran_partido") v -= 6;
        if (o.met === "ana" && k < n - 1) v += e.jg ? -2 : 2;
        if (kids && k === n - 1 && e.jg) v += 3;
        return v;
      };
    };

    var has = function (id) { return !used[id] && pool.some(function (e) { return e.id === id; }); };
    if (tipo === "rec") {
      var recList = [];
      if (has("rondo52")) { used.rondo52 = 1; recList.push({ ex: "rondo52", lite: true, nota: "Intensidad baja: defensores pasivos, 2 toques y sin presión real." }); }
      if (has("futtenis")) { used.futtenis = 1; recList.push({ ex: "futtenis", lite: true }); }
      while (recList.length < n) {
        var r1 = pick("pri", function (e) { return base(e) + (e.i <= 2 ? 5 : -8); });
        if (!r1) break;
        recList.push({ ex: r1.id, lite: true });
      }
      recList.forEach(function (t, i) { t.b = "pri"; t.min = mins[i] || 10; s.tareas.push(t); });
      if (o.cat >= 3 && pool.some(function (e) { return e.id === "ssg_3v3"; }))
        s.tareas.push({ ex: "ssg_3v3", b: "comp", min: 16, nota: "Solo para jugadores con menos de 45 minutos en el partido. Añadir 4-6 sprints de 20-30 m al final." });
    } else if (tipo === "pre" && has("velocidad_reaccion") && has("abp_corner")) {
      var preList = [{ ex: "velocidad_reaccion", nota: "Pocas repeticiones (4-5 por jugador) y recuperación completa: activar, no cansar." }, { ex: "abp_corner" }];
      used.velocidad_reaccion = 1; used.abp_corner = 1;
      if (n >= 4 && has("abp_faltas")) { used.abp_faltas = 1; preList.push({ ex: "abp_faltas" }); }
      if (has("partido_cond")) { used.partido_cond = 1; preList.push({ ex: "partido_cond", lite: true, nota: "Partido corto y de baja intensidad: confianza, automatismos y la estrategia del día." }); }
      var pm = [10];
      var restM = pri - 10, k2 = preList.length - 1;
      for (k = 0; k < k2; k++) pm.push(k === k2 - 1 ? restM - pm.slice(1).reduce(function (a, b) { return a + b; }, 0) : Math.round(restM / k2));
      preList.forEach(function (t, i) { t.b = "pri"; t.min = pm[i]; s.tareas.push(t); });
    } else if (o.met === "tgfu") {
      var gm = pick("pri", function (e) { return mainSc(1)(e) + (e.jg ? 6 : -6); });
      var pr = pick("pri", function (e) { return base(e) + (e.m.indexOf(o.met) >= 0 ? 0 : 3) - Math.abs(e.i - target) + (e.jg ? -6 : 4); });
      if (gm) s.tareas.push({ ex: gm.id, b: "pri", min: mins[0], nota: "Juego inicial: deja jugar y observa. Al terminar, pausa de preguntas." });
      if (pr) s.tareas.push({ ex: pr.id, b: "pri", min: mins[1], nota: "Práctica de la habilidad que ha salido en las preguntas." });
      if (gm) s.tareas.push({ ex: gm.id, b: "pri", min: mins[2], v: "dif", nota: "Vuelta al mismo juego, más difícil: aplicar lo aprendido." });
    } else {
      for (k = 0; k < n; k++) { var m1 = pick("pri", mainSc(k)); if (m1) s.tareas.push({ ex: m1.id, b: "pri", min: mins[k] }); }
    }

    /* Vuelta a la calma */
    var vcE = pick("vc", function (e) {
      return base(e) * 0.3 - e.i * 1.5 + (e.c.indexOf("recuperacion") >= 0 ? 4 : 0) + (kids && e.id === "punteria" ? 1 : 0) +
        (e.id === "fuerza_circuito" && (o.md === "md4" || cont.indexOf("fuerza") >= 0) ? 6 : 0);
    });
    if (vcE) s.tareas.push({ ex: vcE.id, b: "vc", min: vc });

    /* Porteros en paralelo */
    if (o.gk > 0 && tipo !== "rec") {
      var gkE = pick("por", function (e) {
        if (e.id === "gk_aereo" && (cont.indexOf("aereo") >= 0 || cont.indexOf("area") >= 0 || cont.indexOf("abp") >= 0)) return 5;
        if (e.id === "gk_pies" && (cont.indexOf("salida") >= 0 || cont.indexOf("posesion") >= 0)) return 5;
        return 0;
      });
      if (gkE) s.tareas.push({ ex: gkE.id, b: "por", min: cal });
    }

    s.tareas.sort(function (a, b) { return ORDER[a.b] - ORDER[b.b]; });
    return s;
  }

  /* Alternativas para cambiar una tarea */
  function alternativas(s, idx) {
    var t = s.tareas[idx];
    var block = t.b === "comp" ? "pri" : t.b;
    var base = makeBase(s, s.cont, s.tipo);
    var target = MD[s.md] && MD[s.md].int != null ? MD[s.md].int : TIPOS[s.tipo].int;
    var inS = {};
    s.tareas.forEach(function (x) { inS[x.ex] = 1; });
    return EX.filter(function (e) { return e.b.indexOf(block) >= 0 && !inS[e.id] && exOK(e, s); })
      .map(function (e) { return { e: e, v: base(e) - (block === "pri" ? Math.abs(e.i - target) : 0) }; })
      .sort(function (a, b) { return b.v - a.v; })
      .slice(0, 8).map(function (x) { return x.e; });
  }

  /* Organización según jugadores */
  var FMT_MAX = [4, 6, 7, 10, 10, 10, 10];
  function org(e, N, gk, cat) {
    var o = e.o, txt = "", per = N;
    switch (o.t) {
      case "grupo":
        if (N <= o.g + 1) { per = N; txt = "1 grupo de " + N + " · " + o.txt; }
        else {
          var ng = Math.floor(N / o.g), rest = N - ng * o.g;
          per = o.g;
          if (o.g <= 7 && rest >= Math.ceil(o.g * 0.6)) txt = (ng > 1 ? ng + " grupos de " : "1 grupo de ") + o.g + " y 1 de " + rest + " · " + o.txt;
          else txt = (ng > 1 ? ng + " grupos de " : "1 grupo de ") + o.g + " · " + o.txt + (rest ? " · " + rest + (rest > 1 ? " jugadores rotan" : " jugador rota") + " en cada serie" : "");
        }
        break;
      case "eq":
        var k = o.k || 0, mx = e.jg && cat != null ? Math.min(o.max, FMT_MAX[cat]) : o.max, fields = 1, bestD = 1e9;
        for (var f = 1; f <= 4; f++) {
          var pf = Math.floor(N / f), nf = Math.min(mx, Math.floor((pf - k) / 2));
          if (nf < 1) continue;
          var d = (mx - nf) * 2 + (pf - k - 2 * nf) * 0.6;
          if (d < bestD) { bestD = d; fields = f; }
        }
        per = Math.floor(N / fields);
        var nn = Math.max(1, Math.min(mx, Math.floor((per - k) / 2)));
        var extra = per - k - 2 * nn;
        txt = (fields > 1 ? fields + " campos en paralelo · " : "") + o.txt.replace(/\{n\}/g, nn) +
          (extra === 1 ? " (+1 comodín)" : extra > 1 ? " · " + extra + " jugadores rotan en cada serie" : "");
        break;
      case "todos": txt = "Todo el grupo a la vez (" + N + " jugadores)"; break;
      case "parejas": txt = Math.floor(N / 2) + " parejas" + (N % 2 ? " y 1 trío" : ""); break;
      case "olas": txt = o.txt + " · " + (N > 14 ? "2 estaciones en paralelo" : "rotación continua"); break;
      case "filas": txt = (o.txt || "Filas") + " · " + (N > 12 ? "2 estaciones de " + Math.ceil(N / 2) : "rotación continua"); break;
      case "estaciones": txt = Math.ceil(N / 2) + " parejas rotando por 6 estaciones"; break;
      case "gk": txt = gk ? gk + (gk > 1 ? " porteros" : " portero") + " con el entrenador de porteros" : "Porteros con su entrenador"; break;
    }
    if (e.gk && !gk && o.t !== "gk") txt += " · Sin porteros: portería pequeña o gol cruzando una línea";
    return { txt: txt, per: per };
  }

  function espacio(e, per, ctx) {
    if (e.dim) return { txt: e.dim + (ctx.cat <= 1 ? " · reducir distancias un 30-40%" : ctx.cat === 2 ? " · reducir distancias un 15-20%" : "") };
    var mult = e.jg ? CATS[ctx.cat].f : 0.75 + 0.25 * CATS[ctx.cat].f;
    if (e.jg) mult *= (MD[ctx.md] || MD.none).spM;
    if (ctx.nivel === "rec") mult *= 1.1;
    var area = Math.max(per, 2) * e.sp * mult;
    var r = (e.g && e.g.r) || 1.4;
    if (r < 1) r = 1 / r;
    var w = Math.sqrt(area * r), h = area / w;
    var E = ESP[ctx.esp] || ESP.f11, lim = false;
    if (w > E.w) { w = E.w; lim = true; }
    if (h > E.h) { h = E.h; lim = true; }
    var rd = function (v) { return v >= 30 ? Math.round(v / 5) * 5 : Math.max(5, Math.round(v)); };
    w = rd(w); h = rd(h);
    return { txt: w + " × " + h + " m · " + Math.round(w * h / Math.max(per, 1)) + " m²/jugador" + (lim ? " (limitado por tu espacio)" : ""), w: w, h: h };
  }

  function carga(e, T, ctx) {
    var t = e.o.t, w, r;
    if (ctx.lite) return { txt: fmt(T) + " continuos a intensidad baja", ser: 1, w: T, r: 0, cont: true };
    if (t === "estaciones") {
      w = 40 / 60; r = 20 / 60;
      var vueltas = Math.max(1, Math.round(T / (6 * (w + r))));
      return { txt: vueltas + (vueltas > 1 ? " vueltas" : " vuelta") + " · 40'' trabajo / 20'' cambio", ser: vueltas * 6, w: w, r: r, cont: false };
    }
    if (t === "olas" || t === "filas" || t === "gk") return { txt: fmt(T) + " en rotación · trabajo:pausa ≈ 1:3", ser: 1, w: T, r: 0, cont: true };
    if (e.i <= 2) return { txt: fmt(T) + " continuos", ser: 1, w: T, r: 0, cont: true };
    switch (ctx.md) {
      case "md4": w = 3; r = 1.5; break;
      case "md3": w = 8; r = 2; break;
      case "md2": w = 2; r = 2; break;
      case "md1": w = 3; r = 1; break;
      case "md1p": w = 6; r = 1; break;
      default: w = e.i >= 5 ? 3 : e.i === 4 ? 4.5 : 6; r = e.i >= 5 ? 1.5 : 1;
    }
    var kmax = ctx.cat <= 1 ? 6 : ctx.cat === 2 ? 8 : 99;
    if (w > kmax) w = kmax;
    if (T <= w + 0.5) return { txt: fmt(T) + " continuos", ser: 1, w: T, r: 0, cont: true };
    var ser = Math.max(2, Math.round((T + r) / (w + r)));
    w = Math.max(0.5, Math.round(((T - (ser - 1) * r) / ser) * 4) / 4);
    return { txt: ser + " × " + fmt(w) + " · pausa " + fmt(r), ser: ser, w: w, r: r, cont: false };
  }

  function rpe(e, ctx) {
    var v = RPE[e.i];
    if (ctx.md === "md1") v -= 1;
    if (ctx.md === "md4" && e.jg) v += 0.5;
    if (ctx.nivel === "alto") v += 0.5;
    if (ctx.nivel === "rec") v -= 0.5;
    if (["olas", "filas", "gk"].indexOf(e.o.t) >= 0) v *= 0.85;
    if (ctx.lite) v = Math.min(v, 3);
    return clamp(Math.round(v * 2) / 2, 1, 10);
  }

  function detalle(t, s) {
    var e = EXM[t.ex];
    var ctx = { cat: s.cat, md: s.md, nivel: s.nivel, esp: s.esp, lite: !!t.lite };
    var og = org(e, s.N, s.gk, s.cat);
    var sp = espacio(e, og.per, ctx);
    var cg = carga(e, t.min, ctx);
    var subs = e.mat.filter(function (m) { return s.mat.indexOf(m) < 0 && SUB[m]; }).map(function (m) { return MAT[m] + ": usar " + SUB[m]; });
    var regla = null;
    if (e.rd) for (var i = 0; i < s.cont.length; i++) if (REGLA[s.cont[i]]) { regla = REGLA[s.cont[i]]; break; }
    return { e: e, og: og, sp: sp, cg: cg, subs: subs, regla: regla, rpe: rpe(e, ctx) };
  }

  function stats(s) {
    var min = 0, ua = 0;
    s.tareas.forEach(function (t) {
      if (t.b === "por" || t.b === "comp") return;
      var d = detalle(t, s);
      min += t.min; ua += d.rpe * t.min;
    });
    var real = s.cierre && s.cierre.rpe ? s.cierre.rpe * min : null;
    return { min: min, ua: Math.round(ua), rpe: min ? Math.round(ua / min * 10) / 10 : 0, real: real };
  }

  function titulo(s) {
    if (s.tipo === "rec") return "Recuperación post-partido";
    if (s.tipo === "pre") return "Activación pre-partido";
    return TIPOS[s.tipo].n + ": " + s.cont.map(function (c) { return CONT[c].n; }).join(" + ");
  }

  function avisos(s) {
    var a = [];
    var c = CATS[s.cat];
    if (s.dur > c.maxDur) a.push("Para " + c.n + " se recomiendan sesiones de " + c.maxDur + "' como máximo.");
    var m = METS[s.met];
    if (s.cat < m.ed[0] || s.cat > m.ed[1]) a.push("La metodología «" + m.n + "» no es la más habitual en " + c.n + ". Revisa la complejidad de las tareas.");
    if (s.tipo === "rec" && s.dur > 70) a.push("Las sesiones de recuperación suelen durar entre 45' y 60'.");
    if (s.tipo === "pre" && s.dur > 75) a.push("La activación pre-partido suele durar entre 50' y 65': volumen bajo.");
    if (s.cat <= 2 && s.md !== "none") a.push("En " + c.n + " la prioridad es formar: usa el día del microciclo solo como orientación.");
    return a;
  }

  return {
    ex: function (id) { return EXM[id]; }, fmt: fmt, generar: generar, alternativas: alternativas, detalle: detalle,
    stats: stats, titulo: titulo, avisos: avisos, contentsFor: contentsFor, exOK: exOK, edadOK: edadOK, uid: uid, ORDER: ORDER
  };
})();

/* =========================================================
   MÍSTER · Análisis del partido
   Lee lo que escribe el entrenador ("hemos fallado mucho en
   defensa…") y lo traduce a contenidos de entrenamiento.
   Funciona sin conexión: reglas de lenguaje de entrenador.
   ========================================================= */
var Analisis = (function () {
  "use strict";
  var REGLAS = [
    [/defen[sd]|atr[aá]s|encaj|nos (marcar|meti|hicieron)|goles? en contra|recib(imos|ieron)|porter[ií]a a cero/, { bloque: 2, defensa1: 1, area: 1 }],
    [/bascul|distancias?|l[ií]neas? (defensiva|separad|muy lejos)|bloque|huecos|desorden|descolocad|muy abiertos|juntos/, { bloque: 3 }],

  /* ---------- datos ---------- */
  const EJ = [["Álex", 1, "POR"], ["Nico", 13, "POR"], ["Hugo", 2, "DEF"], ["Mateo", 4, "DEF"], ["Leo", 5, "DEF"], ["Pablo", 3, "DEF"], ["Dani", 15, "DEF"], ["Íñigo", 19, "DEF"],

  }
  function load() {

  let S = load() || seed();

  const field = (label, inner, extra) => `<div class="field"><div class="lbl">${label}</div>${inner}${extra || ""}</div>`;
  function weekGrid(start) {
    const days = [];

      const d = addDays(start, i), ss = S.sessions.filter((s) => s.fecha === d);
